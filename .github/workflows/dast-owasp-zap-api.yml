# DAST for backend web APIs via OpenAPI import (not HTML spider).
# Specs live under .zap/openapi/*-web.json (filtered to /web/ paths).
#
# Auth (same secrets as frontend DAST):
# - DAST_AUTH_HEADER_VALUE: e.g. "Bearer <jwt>"
# - DAST_AUTH_HEADER (optional): default Authorization
#
# WARNING: "active" mode sends attack payloads. Prefer staging; on prod use "safe".
# POST endpoints (deposit / orders / join) may mutate data even in safe mode.
name: DAST - OWASP ZAP API

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which OpenAPI spec to scan"
        required: true
        type: choice
        default: all
        options:
          - all
          - asset-ms
          - identity-ms
          - campaign-center-api
      api_host:
        description: "API host (must be allowlisted)"
        required: true
        default: "https://campaignhub.best"
        type: string
      scan_mode:
        description: "safe = import + passive only; active = API active scan"
        required: true
        type: choice
        default: safe
        options:
          - safe
          - active
      use_auth:
        description: "Send DAST_AUTH_HEADER* secrets with the scan"
        required: false
        default: true
        type: boolean

concurrency:
  group: dast-zap-api-${{ github.ref }}
  cancel-in-progress: false

env:
  DAST_ALLOWED_HOSTS: |
    campaignhub.best
    www.campaignhub.best

jobs:
  select-specs:
    name: Resolve specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick OpenAPI files
        id: pick
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            all)
              matrix='["asset-ms","identity-ms","campaign-center-api"]'
              ;;
            asset-ms|identity-ms|campaign-center-api)
              matrix="[\"${SERVICE}\"]"
              ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Scanning services: ${matrix}"

  zap-api:
    name: ZAP API (${{ matrix.service }})
    needs: select-specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select-specs.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate API host
        id: target
        env:
          API_HOST: ${{ inputs.api_host }}
          DAST_ALLOWED_HOSTS: ${{ env.DAST_ALLOWED_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "$API_HOST" =~ ^https://[^/]+ ]]; then
            echo "api_host must start with https:// and include a host"
            exit 1
          fi
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          import ipaddress
          u = urlparse(os.environ["API_HOST"])
          if u.scheme != "https" or not u.hostname:
              raise SystemExit("invalid url")
          if u.username or u.password:
              raise SystemExit("credentials in URL are not allowed")
          host = u.hostname.lower()
          try:
              ipaddress.ip_address(host)
              raise SystemExit("IP targets are not allowed")
          except ValueError:
              pass
          print(host)
          PY
          )"
          allowed=false
          while IFS= read -r candidate; do
            candidate="$(echo "$candidate" | tr -d '[:space:]')"
            [[ -z "$candidate" ]] && continue
            if [[ "$host" == "${candidate,,}" ]]; then
              allowed=true
              break
            fi
          done <<< "$DAST_ALLOWED_HOSTS"
          if [[ "$allowed" != "true" ]]; then
            echo "Host '$host' is not in DAST_ALLOWED_HOSTS"
            exit 1
          fi
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "API host OK: https://${host}"

      - name: Prepare OpenAPI target
        id: spec
        env:
          SERVICE: ${{ matrix.service }}
          API_HOST: ${{ inputs.api_host }}
        run: |
          set -euo pipefail
          spec=".zap/openapi/${SERVICE}-web.json"
          if [[ ! -f "$spec" ]]; then
            echo "Missing OpenAPI file: $spec"
            exit 1
          fi
          # Point servers[0].url at the chosen host while preserving path prefix.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          service = os.environ["SERVICE"]
          api_host = os.environ["API_HOST"].rstrip("/")
          path = Path(f".zap/openapi/{service}-web.json")
          data = json.loads(path.read_text())
          servers = data.get("servers") or [{"url": "https://campaignhub.best"}]
          old = urlparse(servers[0]["url"])
          prefix = old.path.rstrip("/")
          new_base = api_host.rstrip("/")
          servers[0]["url"] = new_base + prefix
          data["servers"] = servers
          out = Path(f"zap-openapi-{service}.json")
          out.write_text(json.dumps(data, indent=2) + "\n")
          print(f"Wrote {out} server={servers[0]['url']} paths={len(data.get('paths') or {})}")
          PY
          echo "file=zap-openapi-${SERVICE}.json" >> "$GITHUB_OUTPUT"

      - name: Prepare ZAP auth environment
        id: auth
        env:
          USE_AUTH: ${{ inputs.use_auth }}
          AUTH_HEADER: ${{ secrets.DAST_AUTH_HEADER }}
          AUTH_HEADER_VALUE: ${{ secrets.DAST_AUTH_HEADER_VALUE }}
          AUTH_SITE: ${{ steps.target.outputs.host }}
        run: |
          set -euo pipefail
          if [[ "${USE_AUTH}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Auth disabled for this run."
            exit 0
          fi
          if [[ -z "${AUTH_HEADER_VALUE}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secret DAST_AUTH_HEADER_VALUE is empty; scanning as anonymous."
            exit 0
          fi
          echo "::add-mask::${AUTH_HEADER_VALUE}"
          delimiter="$(openssl rand -hex 16)"
          {
            echo "ZAP_AUTH_HEADER<<${delimiter}"
            printf '%s\n' "${AUTH_HEADER:-Authorization}"
            echo "${delimiter}"
            echo "ZAP_AUTH_HEADER_VALUE<<${delimiter}"
            printf '%s\n' "${AUTH_HEADER_VALUE}"
            echo "${delimiter}"
            echo "ZAP_AUTH_HEADER_SITE<<${delimiter}"
            printf '%s\n' "${AUTH_SITE}"
            echo "${delimiter}"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "header_name=${AUTH_HEADER:-Authorization}" >> "$GITHUB_OUTPUT"

      - name: OWASP ZAP API Scan
        id: zap
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        continue-on-error: true
        with:
          target: ${{ steps.spec.outputs.file }}
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report-${{ matrix.service }}
          cmd_options: ${{ inputs.scan_mode == 'safe' && '-S -I' || '-I' }}

      - name: Collect local report copies
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p "zap-api-reports/${SERVICE}"
          shopt -s nullglob
          for f in report_html.html report_json.json report_md.md; do
            if [[ -f "$f" ]]; then
              cp -f "$f" "zap-api-reports/${SERVICE}/"
            fi
          done
          find . -maxdepth 3 \( -name 'report_html.html' -o -name 'report_json.json' -o -name 'report_md.md' \) \
            -print0 2>/dev/null | while IFS= read -r -d '' f; do
            cp -f "$f" "zap-api-reports/${SERVICE}/" || true
          done
          ls -la "zap-api-reports/${SERVICE}" || true

      - name: Upload API reports artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-api-dast-${{ matrix.service }}
          path: |
            zap-api-reports/
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize result
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
          SCAN_MODE: ${{ inputs.scan_mode }}
          API_HOST: ${{ inputs.api_host }}
          AUTH_ENABLED: ${{ steps.auth.outputs.enabled }}
          AUTH_HEADER_NAME: ${{ steps.auth.outputs.header_name }}
          AUTH_SITE: ${{ steps.target.outputs.host }}
          SPEC_FILE: ${{ steps.spec.outputs.file }}
        run: |
          {
            echo "## DAST - OWASP ZAP API (\`${SERVICE}\`)"
            echo ""
            echo "- **API host:** \`${API_HOST}\`"
            echo "- **OpenAPI:** \`.zap/openapi/${SERVICE}-web.json\` → \`${SPEC_FILE}\`"
            echo "- **Mode:** \`${SCAN_MODE}\`"
            if [[ "${AUTH_ENABLED}" == "true" ]]; then
              echo "- **Auth:** secret as \`${AUTH_HEADER_NAME:-Authorization}\` (scoped to \`${AUTH_SITE}\`)"
            else
              echo "- **Auth:** none (anonymous)"
            fi
            echo "- **Fail on findings:** no (report-only)"
            echo "- **Artifact:** \`zap-api-dast-${SERVICE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
